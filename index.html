<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A Little Surprise 🤍</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- PASSWORD SCREEN -->
<div id="passwordScreen" class="screen">
  <h1>Enter the secret 🤍</h1>
  <input type="password" id="passwordInput" placeholder="Password">
  <button onclick="checkPassword()">Unlock</button>
</div>

<!-- INTRO -->
<div id="intro" class="screen hidden">
  <h1>This is for two people who were always meant to find each other.</h1>
  <button onclick="startExperience()">Begin</button>
</div>

<!-- MUSIC -->
<audio id="bgMusic" loop>
  <source src="music/song.mp3" type="audio/mpeg">
</audio>

<!-- MAIN CONTENT -->
<div id="content" class="hidden">
  <h2>Some Beautiful Memories 📸</h2>
  <div class="gallery" id="gallery"></div>

  <h2>A Little Film 🎬</h2>
  <div id="videoGallery" class="gallery"></div>

  <p class="message">
    Thank you for loving each other the way you do 🤍<br>
    Your story is one of our favorites.
  </p>

  <button onclick="showFinal()">One last thing…</button>
</div>

<!-- FINAL SCREEN -->
<div id="finalScreen" class="screen hidden">
  <h1>We love you both 🤍</h1>
  <p>Never stop choosing each other.</p>
</div>

<!-- OVERLAY -->
<div id="overlay" onclick="closeOverlay()">
  <img id="overlayImg">
  <video id="overlayVideo" controls></video>
</div>

<!-- HEARTS -->
<div id="hearts"></div>

<script src="script.js"></script>
</body>
</html>
